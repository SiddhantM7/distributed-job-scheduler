services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobscheduler
      POSTGRES_USER: jobscheduler
      POSTGRES_PASSWORD: jobscheduler
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobscheduler"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://jobscheduler:jobscheduler@postgres:5432/jobscheduler
      JWT_SECRET: dev-secret-change-in-production
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
      LLM_PROVIDER: ${LLM_PROVIDER}
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://jobscheduler:jobscheduler@postgres:5432/jobscheduler
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m workers.main
    volumes:
      - ./backend:/app

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://jobscheduler:jobscheduler@postgres:5432/jobscheduler
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m scheduler.main
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata: